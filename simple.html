<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cram-Kit · Simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mocks.css?v=6">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#16161a;--muted:#55555f;--line:#dedcd4;--accent:#c2185b;--accent-ink:#fff;--ok:#1b7f4b;--ok-bg:#eaf6ef;--warn:#8a4500;--warn-bg:#fff2e0;--soft:#fbe9f0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121214;--card:#1b1b1f;--ink:#efeef3;--muted:#a9a8b3;--line:#2e2e35;--accent:#ff6fa8;--accent-ink:#16161a;--ok:#5fd394;--ok-bg:#16291f;--warn:#ffb36b;--warn-bg:#2b2116;--soft:#2a1a22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 80px}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ck-i{width:20px;height:20px;flex:none}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
header h1{margin:0;font-size:30px}
header .back{margin-left:auto;font-size:16px}
.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}
nav.top{display:flex;gap:8px;margin:0 0 20px;border-bottom:2px solid var(--line)}
nav.top button{background:none;border:0;padding:10px 14px;font:700 17px inherit;font-family:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.top button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pane[hidden]{display:none}
/* guide */
.ck-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ck-prog{flex:1;min-width:160px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.ck-prog i{display:block;height:100%;background:var(--ok)}
.ck-modes{display:flex;gap:6px}
.ck-modes button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);padding:6px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.ck-modes button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.ck-wiz{display:block}.ck-steps{display:none}
.ck-count{color:var(--muted);font-size:16px}
.ck-step{display:grid;grid-template-columns:1fr;gap:14px}
.ck-step-text{display:contents}.ck-step-text>*{order:4}
.ck-title{order:1;font-size:30px;line-height:1.2;margin:4px 0 0;outline:none}
.ck-lead{order:2;font-size:19px;margin:0}
.ck-step-visual{order:3;max-width:640px}
.ck-mock{--m-accent:var(--accent);--m-bg:var(--card);--m-surface:var(--bg);--m-ink:var(--ink);--m-line:var(--line);--m-muted:var(--muted);--m-font:inherit;font-size:clamp(12px,1.6vw,15px)}
.ck-list{margin:0;padding-left:26px}.ck-list li{margin:8px 0}
kbd{font:700 15px inherit;font-family:inherit;padding:1px 8px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
code{font:15px ui-monospace,Menlo,monospace;background:var(--line);padding:1px 6px;border-radius:5px}
.ck-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ck-row.tight{gap:6px}
.ck-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink)}
.ck-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck-btn.small{padding:6px 12px;font-size:15px}
.ck-btn:disabled{opacity:.4;cursor:not-allowed}
.ck-btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ck-bm{display:inline-flex;padding:14px 22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;cursor:grab}
.ck-bm.small{padding:6px 12px;font-size:15px}
.ck-hint{color:var(--muted);font-size:16px;display:inline-flex;gap:4px;align-items:center}
.ck-hint .ck-i{transform:rotate(90deg)}
.ck-open{display:flex;gap:8px;max-width:560px}
.ck-open input,.ck-form input,.ck-form select{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px}
.ck-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px}
.ck-form label{display:grid;gap:4px;font-weight:700;font-size:16px}
.ck-form .wide{grid-column:1/-1}
.ck-done{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;max-width:600px}
.ck-done input{position:absolute;opacity:0}
.ck-box{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.ck-done input:checked+.ck-box{background:var(--ok);border-color:var(--ok);color:#fff}
.ck-done:has(input:checked){border-color:var(--ok);background:var(--ok-bg)}
.ck-done:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.ck-help summary{cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.ck-ok{color:var(--ok);font-weight:700;display:flex;gap:6px;align-items:center}
.ck-warn{padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);max-width:640px}
.ck-note{color:var(--ok);font-size:16px;display:flex;gap:6px;align-items:center;margin:0}
.ck-pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;max-height:320px;overflow:auto}
.ck-try{display:flex;flex-wrap:wrap;gap:8px}
.ck-chip{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.ck-nav{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:2px solid var(--line)}
.ck-gate{flex:1;text-align:right;color:var(--muted);font-size:16px}
.ck-sechead{font-size:22px;margin:24px 0 10px}
.ck-card{padding:20px;margin-bottom:14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.ck-card.did{border-color:var(--ok)}
.ck-card .ck-num{display:inline-block;font-weight:700;color:var(--accent);margin-bottom:4px}
.ck-card .ck-title{font-size:24px}
/* toolkit */
.ck-cram-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ck-cram{padding:12px 20px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.ck-cram.on{background:var(--accent);color:var(--accent-ink)}
.ck-aform{grid-template-columns:1fr 1fr;max-width:none}
.ck-ql{display:block;font-weight:700;font-size:16px;margin-bottom:6px}
.ck-chips{display:flex;flex-wrap:wrap;gap:6px}
.ck-chips label{display:inline-flex;flex-direction:row;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:400;font-size:16px;cursor:pointer}
.ck-chips label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.ck-out{padding:18px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin:16px 0}
.ck-out h4{margin:10px 0 6px;font-size:19px}.ck-out h4:first-child{margin-top:0}
.ck-table{width:100%;border-collapse:collapse;font-size:16px}
.ck-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ck-table td:first-child{color:var(--muted);width:46%}
.ck-table small{display:block;color:var(--muted)}
.ck-libitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin-bottom:8px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
@media (max-width:640px){.ck-form,.ck-aform{grid-template-columns:1fr}.ck-title{font-size:25px}}
/* phases + what you can make */
.ck-phases{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.ck-phases button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.ck-phases button[aria-selected=true]{border-color:var(--accent);background:var(--soft)}
.ck-phases b{display:block;font-size:18px}.ck-phases small{display:block;color:var(--muted);font-size:15px}
.ck-pn{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700}
.ck-makelead{margin:0 0 16px!important}
.ck-recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ck-rcard{display:grid;gap:4px;align-content:start;text-align:left;padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.ck-rcard:hover{border-color:var(--accent)}
.ck-rnum{font-weight:700;color:var(--accent);font-size:15px}.ck-rcard b{font-size:21px;line-height:1.2}.ck-rcard span{color:var(--muted)}
.ck-rcard .ck-rgo{display:inline-flex;gap:6px;align-items:center;margin-top:8px;color:var(--accent);font-weight:700}
.ck-recipe .ck-step{margin-top:12px}.ck-endrow{justify-content:center;margin:20px 0}
@media (max-width:640px){.ck-phases{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><h1>Cram-Kit</h1><a class="back" href="./">Back to the full version</a></header>
  <p class="lede">The simple version: no background effects or music, bigger text. Same steps and tools. Your progress is shared with the full version.</p>
  <nav class="top" role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-p="p-guide">Step-by-step guide</button>
    <button role="tab" aria-selected="false" data-p="p-tools">Anki planner</button>
    <button role="tab" aria-selected="false" data-p="p-lib">Prompts &amp; buttons</button>
  </nav>
  <section class="pane" id="p-guide"><div id="wiz"></div></section>
  <section class="pane" id="p-tools" hidden><div id="anki"></div></section>
  <section class="pane" id="p-lib" hidden><div id="lib"></div></section>
</main>
<script src="assets/data.js"></script>
<script src="assets/core.js?v=6"></script>
<script>
const {$,$$}=CK;
let anki;
function tab(id){$$('nav.top button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===id));$$('.pane').forEach(p=>p.hidden=p.id!==id);if(id==='p-tools'){anki=anki||CK.ankiTool($('#anki'));anki.update();}}
$$('nav.top button').forEach(b=>b.onclick=()=>tab(b.dataset.p));
CK.wizard($('#wiz'),{modeKey:'mode_simple',defaultMode:'list',onTool:()=>tab('p-tools')});
CK.library($('#lib'));
</script>
</body>
</html>
